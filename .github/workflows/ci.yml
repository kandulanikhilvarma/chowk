# Runs the same gate as `npm run check` on every push and pull request, then the read-only
# end-to-end tests against the production build.
#
# Repository secrets (Settings > Secrets and variables > Actions):
#   NEXT_PUBLIC_SUPABASE_URL, NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY
# Both are public values (RLS protects the data); the build needs them because the home page and
# the legal pages prerender with live categories and ads.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
  NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
  NEXT_PUBLIC_SITE_URL: http://localhost:3000

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run contrast
      - run: npm run typecheck
      - run: npm run lint
      # Build before the unit tests: tests/unit/csp.test.ts checks the prerendered pages against the build.
      - run: npm run build
      - run: npm test
      - name: End-to-end (read-only)
        run: |
          npm start &
          for i in $(seq 1 30); do curl -sf http://localhost:3000/api/health && break; sleep 2; done
          npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7
